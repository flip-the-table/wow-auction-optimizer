version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - npm install
            # Write runtime env vars to .env.production so Next.js SSR can access them
            - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
            - echo "REGION=$REGION" >> .env.production
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
