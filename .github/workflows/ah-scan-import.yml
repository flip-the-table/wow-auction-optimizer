name: AH Scan Import

# Manual import of committed AH scan files (data/ah_scans/*.v1.json) into
# auction_owners. Idempotent — already-imported filenames are skipped.
on:
  workflow_dispatch:

jobs:
  import-scans:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import scans
        run: python -m services.jobs.scan_import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_SYNC: ${{ secrets.DATABASE_URL_SYNC }}
